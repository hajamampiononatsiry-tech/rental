services:
  - type: web
    name: adrware-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: application/backend
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: EMAIL_HOST_USER
        value: "adrwarecontact@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false