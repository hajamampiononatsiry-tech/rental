databases:
  - name: adrware-db
    databaseName: rental_db
    user: postgres
    plan: free

services:
  - type: web
    name: adrware-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: application/backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adrware-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: EMAIL_HOST_USER
        value: "adrwarecontact@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false